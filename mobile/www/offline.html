<!doctype html>
<!-- Shown by the native shell when https://www.coursechart.app cannot be
     reached (capacitor.config.ts → server.errorPath). Self-contained: there is
     no network to load anything else from, and on Android it has no access to
     Capacitor plugins either. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CourseChart</title>
    <style>
      :root { --bg: #ffffff; --fg: #18181b; --muted: #71717a; --btn: #152a4d; --btn-fg: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #09090b; --fg: #f4f4f5; --muted: #a1a1aa; --btn: #f4f4f5; --btn-fg: #09090b; }
      }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box; text-align: center;
      }
      main { max-width: 320px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
      a {
        display: inline-block; padding: 12px 20px; border-radius: 8px;
        background: var(--btn); color: var(--btn-fg); text-decoration: none;
        font-weight: 600; font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>CourseChart needs a connection to load your profile. Nothing you saved has been lost.</p>
      <a href="https://www.coursechart.app">Try again</a>
    </main>
  </body>
</html>
